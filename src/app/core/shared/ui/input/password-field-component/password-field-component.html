
<div 
    [class.filled] = "value() != ''"
    class="input-field"
>
    <label for="password-id">{{label()}}</label>

    <input 
        [value]="value()"
        (input)="handleInputChange($event)"
        [type]="isPasswordVisible() ? 'text' : 'password'"
        [disabled] = "disabled()"
        name="email" 
        id="password-id"
        
    >



    <div class="absolute right-0 cursor-pointer" (click)="togglePasswordVisibility()">
        <mat-icon class="icon">{{isPasswordVisible() ? 'visibility' : 'visibility_off'}}</mat-icon>
    </div>
 
</div>
