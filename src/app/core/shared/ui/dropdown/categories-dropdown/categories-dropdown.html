<button (blur)="handleBlur()" class="relative block text-left w-full max-w-sm" (click)="$event.stopPropagation()">

  <!-- Trigger -->
  <div
    class="flex items-center justify-between px-3 py-2 border border-gray-300 rounded-lg bg-gray-50
           cursor-pointer transition shadow-sm"
    [class.border-red-500]="isInvalid()"
    [class.focus:ring-red-200]="isInvalid()"
    
    (click)="toggle()"
  >
    @if (selectedCategory(); as selectedCategory) {
      <span class="flex items-center gap-2 text-sm truncate">
        <span
          class="truncate"
          [class.text-blue-700]="selectedCategory.gender === 'MALE'"
          [class.text-pink-700]="selectedCategory.gender === 'FEMALE'"
          [class.font-medium]="true"
        >
          {{ selectedCategory.name }}
        </span>

        <span
          class="shrink-0 rounded-full px-2 py-0.5 text-[11px] font-semibold uppercase tracking-wide"
          [class.bg-blue-100]="selectedCategory.gender === 'MALE'"
          [class.text-blue-700]="selectedCategory.gender === 'MALE'"
          [class.bg-pink-100]="selectedCategory.gender === 'FEMALE'"
          [class.text-pink-700]="selectedCategory.gender === 'FEMALE'"
        >
          {{ selectedGenderLabel() }}
        </span>
      </span>
    } @else {
      <span class="text-sm text-gray-700 truncate">
        Select category
      </span>
    }

    <span
      class="text-xs text-gray-400 transition-transform duration-150"
      [class.rotate-180]="isOpen()"
    >
      ▼
    </span>
  </div>

  <!-- Dropdown -->
  @if (isOpen()) {
    <div class="absolute z-30 mt-1 w-full bg-white border border-gray-200 rounded-lg shadow-lg max-h-72 overflow-y-auto">

      <!-- Loading -->
      @if (categories().length === 0) {
        <div class="px-3 py-2 text-sm text-gray-400">
          Loading categories...
        </div>
      }

      <!-- MALE -->
      @if (groupedCategories().MALE.length > 0) {

        <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-blue-600 bg-blue-50">
          Men
        </div>

        @for (category of groupedCategories().MALE; track category.id) {
          <div
            (click)="selectCategory(category)"
            class="px-3 py-2 text-sm cursor-pointer transition
                   hover:bg-blue-50 hover:text-blue-700"
            [class.bg-blue-100]="category.id === selectedCategory()?.id"
            [class.text-blue-700]="category.id === selectedCategory()?.id"
            [class.font-medium]="category.id === selectedCategory()?.id"
          >
            {{ category.name }}
          </div>
        }
      }

      <!-- FEMALE -->
      @if (groupedCategories().FEMALE.length > 0) {

        <div class="px-3 py-2 text-xs font-semibold uppercase tracking-wide text-pink-600 bg-pink-50 border-t">
          Women
        </div>

        @for (category of groupedCategories().FEMALE; track category.id) {
          <div
            (click)="selectCategory(category)"
            class="px-3 py-2 text-sm cursor-pointer transition
                   hover:bg-pink-50 hover:text-pink-700"
            [class.bg-pink-100]="category.id === selectedCategory()?.id"
            [class.text-pink-700]="category.id === selectedCategory()?.id"
            [class.font-medium]="category.id === selectedCategory()?.id"
          >
            {{ category.name }}
          </div>
        }
      }

    </div>
  }

</button>
