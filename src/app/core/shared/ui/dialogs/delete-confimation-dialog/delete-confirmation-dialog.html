<section
  class="w-full max-w-xl px-6 py-5 rounded-2xl 
         bg-white/90 backdrop-blur-xl 
         shadow-[0_10px_30px_rgba(0,0,0,0.08),0_2px_8px_rgba(0,0,0,0.05)]
         text-slate-800
         animate-[fadeIn_.18s_ease]"
>
  <!-- Header -->
    <h2
        id="delete-dialog-title"
        class="m-0 text-xl leading-tight font-medium tracking-tight text-slate-900"
    >
        {{ data.title }}
    </h2>
  <!-- Message -->
  <p
    id="delete-dialog-message"
    class="mt-4 text-sm leading-relaxed text-slate-600"
  >
    {{ data.message }}
  </p>

  
  @for (note of data.notes; track $index) {
    <p class="mt-3 flex items-start gap-2 text-sm leading-relaxed text-slate-500">
      <span class="mt-1 text-slate-400">•</span>
      <span>{{ note }}</span>
    </p>
  }

  <!-- Actions -->
  <div class="mt-6 flex justify-end gap-2">
    <button
      type="button"
      class="px-4 py-2 rounded-lg text-sm font-medium
             bg-slate-100 text-slate-700 border border-slate-200
             transition-all duration-150
             hover:bg-slate-200 hover:-translate-y-px
             active:scale-[0.97]"
      (click)="close()"
    >
      {{ data.cancelLabel }}
    </button>

    <button
      type="button"
      class="px-4 py-2 rounded-lg text-sm font-medium text-white
             bg-red-500 border border-red-500
             shadow-sm
             transition-all duration-150
             hover:bg-red-600 hover:-translate-y-px hover:shadow-md
             active:scale-[0.97]"
      (click)="confirm()"
    >
      {{ data.confirmLabel }}
    </button>
  </div>
</section>
