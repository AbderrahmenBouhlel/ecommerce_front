    [attr.aria-label]="brandName() + ' home'"
  >

    <div class="grid place-items-center w-9 h-9 overflow-hidden rounded-xl bg-slate-800 shadow-lg border border-slate-700/50">

        width="1354"
        height="738"
        alt="Shoply logo"
        priority

      />

    <!-- Brand text -->
    <div class="flex flex-col leading-none">
      <span class="text-base font-bold tracking-wide text-white group-hover:text-slate-200">
