<nav class="flex items-center justify-start px-4 py-4 border-b border-slate-200 bg-linear-to-br from-white/95 to-slate-50/90 backdrop-blur-md">
  
  <a
    class="flex items-center gap-3 text-inherit no-underline group focus-visible:outline-2 focus-visible:outline-blue-500 focus-visible:outline-offset-4 rounded-xl"
    [routerLink]="homeLink()"
    [attr.aria-label]="brandName() + ' home'"
  >

    <!-- Logo -->
    <div class="grid place-items-center w-10 h-10 overflow-hidden rounded-xl bg-linear-to-br from-slate-900 to-slate-700 shadow-lg">
      <img
        ngSrc="/images/logo.png"
        width="36"
        height="36"
        alt=""
        priority
        class="w-full h-full object-cover"
      />
    </div>

    <!-- Text -->
    <div class="flex flex-col leading-none">
      <span class="text-base font-bold tracking-wide text-slate-900 group-hover:text-slate-700">
        {{ brandName() }}
      </span>
    </div>

  </a>
</nav>
