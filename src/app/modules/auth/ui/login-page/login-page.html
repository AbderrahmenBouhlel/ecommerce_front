

<div class="flex flex-col items-center ">
    <img src="svgs/logo-sh.svg" class="w-20 md:w-28 lg:w-34 h-auto" alt="Logo">
    <h1 class="text-3xl font-semibold text-center pb-20!">Welcome Back</h1>

</div>

<form
  class="flex flex-col gap-8 transition-all duration-300"
>
    
    <app-email-field-component
        [value]="loginState().email"
        [label]="'Email'"
        (inputChangeEventEmitter)="onEmailChange($event)"
        (focusEventEmitter)="onEmailFocus()"
        (blurEventEmitter)="onEmailBlur()"
        [disabled]="isLoading()"
    >
    </app-email-field-component>


    <app-password-field-component
        [value]="loginState().password"
        [label]="'Password'"
        (inputChangeEventEmitter)="onPasswordChange($event)"
        (passwordVisibilityToggleEventEmitter)="onPasswordVisibiltyChange($event)"
        [disabled]="isLoading()"
    >
    </app-password-field-component>



    <button
        type="button"
        (click)="login($event)"
        class="w-full h-10 bg-black text-white rounded-2xl 
                transition-all duration-200 active:scale-95
                disabled:opacity-50 disabled:cursor-not-allowed
                flex items-center justify-center gap-2"
        [disabled]="isLoading()"
    >
        Sign in
    </button>


    <div
        class="text-red-500 text-sm text-center mt-2 min-h-5
                transition-all duration-300 ease-out"
        [class.opacity-0]="!errorMessage()"
        [class.opacity-100]="!!errorMessage()"
        [class.translate-y-1]="!errorMessage()"
        >
        {{ errorMessage() || '' }}
    </div>
</form>
