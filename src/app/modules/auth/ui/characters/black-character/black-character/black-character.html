



<svg  viewBox="0 0 130 220" width="100%" height="100%"  xmlns="http://www.w3.org/2000/svg">

    <g #characterBody id="character-body" transform="translate(0, 0) rotate(0)">
        <path #characterShape id="character-shape" fill="black"/>
       
        <g #eyePairContainer id="eye-pair-container" transform="translate(0, 0)">
            <g id="eyePair"  #eyePair transform="translate(40, 25)">
                <g id="leftEye"  #leftEye    transform="translate(-11, 0)">
                    <circle class="sclera" cx="0" cy="0" r="8" fill="white" stroke="black" stroke-width="1"></circle>
                    <circle id="leftPupil" class="eye-pupil" cx="0" cy="0" r="4" fill="black"></circle>
                    
                    <path id="leftEyelid" fill="black"/>
                </g>
                <g id="rightEye" #rightEye  transform="translate(11, 0)">
                    <circle class="sclera" cx="0" cy="0" r="8" fill="white" stroke="black" stroke-width="1"></circle>
                    <circle id="rightPupil" class="eye-pupil" cx="0" cy="0" r="4" fill="black"></circle>
        
                    <path id="rightEyelid" fill="black"/>
                </g>
            </g>
        </g>
       
    </g>

</svg>
