<svg  viewBox="0 0 160 300" width="100%" height="100%"  xmlns="http://www.w3.org/2000/svg">
    <g #characterBody id="character-body" transform="translate(0, 0) rotate(0)">
        <path #characterShape fill="#5c21fe"/>
       
        <g #faceContainer id="face-container" transform="translate(0, 0)">
            <g id="face"  #face transform="translate(80, 20)">
                <g id="leftEye"     transform="translate(-20, 0)">
                    <ellipse class="sclera" cx="0" cy="0" rx="4" ry="4" fill="white" stroke="#5c21fe" stroke-width="0.2"></ellipse>
                    <circle id="leftPupil" class="eye-pupil" cx="0" cy="0" r="2" fill="black"></circle>
                    <path id="leftEyelid" fill="#5c21fe"/>
                </g>

                <g id="rightEye"  transform="translate(20, 0)">
                    <ellipse class="sclera" cx="0" cy="0" rx="4" ry="4" fill="white" stroke="#5c21fe" stroke-width="0.2"></ellipse>
                    <circle id="rightPupil" class="eye-pupil" cx="0" cy="0" r="2" fill="black"></circle>
                    <path id="rightEyelid" fill="#5c21fe"/>
                </g>

                <g id="mouth" #mouth transform="translate(0, 15)">
                    <path id="mouthShape" fill="black"/>
                </g>
            </g>
        </g>
       
    </g>

</svg>
