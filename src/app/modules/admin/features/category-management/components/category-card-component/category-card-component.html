<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm min-h-50">
  <div class="flex items-start justify-between gap-3">
    <h3 class="m-0 text-xl font-semibold tracking-tight text-slate-900">
      {{ category().name }}
    </h3>

    <span
      class="inline-flex items-center rounded-md px-2.5 py-1 text-xs font-semibold"
      [class.bg-sky-100]="category().gender === 'MALE'"
      [class.text-sky-700]="category().gender === 'MALE'"
      [class.bg-rose-100]="category().gender === 'FEMALE'"
      [class.text-rose-700]="category().gender === 'FEMALE'"
    >
      {{ category().gender }}
    </span>
  </div>

  <p class="mt-2 mb-4 text-sm text-slate-500">
    {{ description() }}
  </p>

  <div class="flex flex-wrap gap-2">
    @for (item of visibleAllowedFilters(); track item.id) {
      <span class="inline-flex items-center rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm font-medium text-slate-700">
        {{ item.name }}
      </span>
    }

    @if (hiddenAllowedFiltersCount() > 0) {
      <span class="inline-flex items-center rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm font-medium text-slate-500">
        +{{ hiddenAllowedFiltersCount() }} more
      </span>
    }

    @if (category().allowedFilters.length === 0) {
      <span class="inline-flex items-center rounded-md border border-orange-200 bg-orange-50 px-3 py-1 text-sm font-medium text-orange-500">
        No allowed filters
      </span>
    }
  </div>
</div>
