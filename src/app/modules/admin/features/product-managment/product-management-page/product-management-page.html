<div class="px-24 py-20">
	<div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
		<div class="flex-1">
			<h1 class="text-2xl sm:text-3xl font-semibold text-gray-900">Product Management</h1>
			<p class="mt-2 text-sm text-gray-500 max-w-3xl">Manage your product catalog — create, edit, and organize products across categories.The main content will appear below.</p>
		</div>
		<div class="shrink-0">

			<button type="button" 
                class="inline-flex items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-slate-800 active:scale-[0.98]"
				[ngClass]="['shadow-sm']" 
                (click)="createProduct()"
            >
				Create New Product
			</button>
		</div>
	</div>

	<div class="bg-white rounded-lg shadow-sm p-6 min-h-65">
		<!-- Bottom content placeholder (empty for now) -->
		<div class="flex flex-col items-center justify-center text-gray-400 h-full">
			<svg class="w-12 h-12 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
			<p class="text-sm">No content yet — coming soon.</p>
		</div>
	</div>

	<router-outlet></router-outlet>
</div>
