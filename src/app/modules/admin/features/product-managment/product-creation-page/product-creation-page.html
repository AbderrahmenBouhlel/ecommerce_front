<div class="p-6 lg:px-10 font-sans">
  <!-- Top Navigation -->
  <div class="mb-5" (click)="handleBackNavigation()">
    <button class="text-gray-500 hover:text-gray-700 text-md flex items-center gap-2 mb-4 transition-colors cursor-pointer">
      <span>←</span> Back to Catalog
    </button>
    <h1 class="text-2xl font-bold text-slate-900">Create New Product</h1>
  </div>

  <!-- Stepper -->
  <div class="flex items-center gap-4 mb-4 overflow-x-auto pb-2">
    <!-- Step 1 -->
    <div class="flex items-center gap-3 shrink-0">
      <div [ngClass]="{
        'bg-indigo-600 text-white': currentStepIndex() === 1,
        'bg-indigo-100 text-indigo-600': currentStepIndex() > 1,
        'bg-gray-100 text-gray-500': currentStepIndex() < 1
      }" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all">
        1
      </div>
      <div class="flex flex-col">
        <span [class.text-indigo-600]="currentStepIndex() >= 1" class="text-sm font-semibold text-gray-400">General Info</span>
        <span class="text-xs text-gray-400">Step 1</span>
      </div>
    </div>

    <div class="w-10 h-px bg-gray-200"></div>

    <!-- Step 2 -->
    <div class="flex items-center gap-3 shrink-0">
      <div [ngClass]="{
        'bg-indigo-600 text-white': currentStepIndex() === 2,
        'bg-indigo-100 text-indigo-600': currentStepIndex() > 2,
        'bg-gray-100 text-gray-500': currentStepIndex() < 2
      }" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all">
        2
      </div>
      <div class="flex flex-col">
        <span [class.text-indigo-600]="currentStepIndex() >= 2" class="text-sm font-semibold text-gray-400">Colors & Photos</span>
        <span class="text-xs text-gray-400">Step 2</span>
      </div>
    </div>

    <div class="w-10 h-px bg-gray-200"></div>

    <!-- Step 3 -->
    <div class="flex items-center gap-3 shrink-0">
      <div [ngClass]="{
        'bg-indigo-600 text-white': currentStepIndex() === 3,
        'bg-indigo-100 text-indigo-600': currentStepIndex() > 3,
        'bg-gray-100 text-gray-500': currentStepIndex() < 3
      }" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all">
        3
      </div>
      <div class="flex flex-col">
        <span [class.text-indigo-600]="currentStepIndex() >= 3" class="text-sm font-semibold text-gray-400">Sizes & Inventory</span>
        <span class="text-xs text-gray-400">Step 3</span>
      </div>
    </div>

    <div class="w-10 h-px bg-gray-200"></div>

    <!-- Step 4 -->
    <div class="flex items-center gap-3 shrink-0">
      <div [ngClass]="{
        'bg-indigo-600 text-white': currentStepIndex() === 4,
        'bg-indigo-100 text-indigo-600': currentStepIndex() > 4,
        'bg-gray-100 text-gray-500': currentStepIndex() < 4
      }" class="w-10 h-10 rounded-full flex items-center justify-center font-bold transition-all">
        4
      </div>
      <div class="flex flex-col">
        <span [class.text-indigo-600]="currentStepIndex() >= 4" class="text-sm font-semibold text-gray-400">Attributes</span>
        <span class="text-xs text-gray-400">Step 4</span>
      </div>
    </div>
  </div>

  <hr class="border-gray-100 mb-4" />

  <!-- Content -->
  <div class="min-h-90">
      <router-outlet></router-outlet>
  </div>


  <!-- Navigation Footer -->
  <div class="mt-4 flex items-center justify-between border-t border-gray-100 pt-8">
    <button 
      (click)="goPreviousStep()"
      [disabled]="currentStepIndex() === 1"
      class="px-6 py-2.5 rounded-lg font-semibold text-gray-600 hover:bg-gray-50 disabled:opacity-0 border border-gray-300 cursor-pointer transition-all">
      Previous
    </button>

    <button 
      (click)="goNext()"
      class="px-8 py-2.5 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 shadow-md shadow-indigo-200 cursor-pointer transition-all">
      {{ currentStepIndex() === 4 ? 'Finish' : 'Next Step' }}
    </button>
  </div>


</div>
