<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-sm">
	<div class="border-b border-slate-100 px-6 py-5">
		<h2 class="text-xl font-semibold tracking-tight text-slate-900">
			Product Attributes
		</h2>

		<p class="mt-1 text-sm text-slate-500">
			Select the attributes that describe this product.
		</p>
	</div>

	<section class="px-6 py-6">
		<div class="mb-6 flex items-center justify-between">
			<p class="text-sm text-slate-500">
				{{ selectedCount() }} value(s) selected
			</p>
		</div>

		<div class="space-y-7">
			@for (filter of filters(); track filter.id) {
				<article class="space-y-3">
					<div class="flex items-center gap-2">
						<h3 class="text-sm font-semibold uppercase tracking-wide text-slate-700">
							{{ filter.name }}
						</h3>

						<div class="h-px flex-1 bg-slate-200"></div>
					</div>

					<div class="flex flex-wrap gap-3">
						@for (value of filter.values; track value.id) {
							<button
								type="button"
								class="group inline-flex items-center gap-2 rounded-xl border px-4 py-2 text-sm font-medium transition-all duration-200"
								[class.border-indigo-500]="value.selected"
								[class.bg-indigo-500]="value.selected"
								[class.text-white]="value.selected"
								[class.shadow-sm]="value.selected"
								[class.border-slate-200]="!value.selected"
								[class.bg-white]="!value.selected"
								[class.text-slate-700]="!value.selected"
								[class.hover:border-slate-300]="!value.selected"
								[class.hover:bg-slate-50]="!value.selected"
								(click)="toggleValue(filter.id, value.id)"
							>
								@if (value.selected) {
									<span class="text-xs">✓</span>
								}

								<span>{{ value.label }}</span>
							</button>
						}
					</div>
				</article>
			}
		</div>
	</section>
</div>

<div class="mt-6 flex justify-between">
	<button
		type="button"
		(click)="previous()"
		class="rounded-xl border border-slate-300 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50"
	>
		Back
	</button>

	<button
		type="button"
		(click)="next()"
		class="rounded-xl bg-indigo-600 px-5 py-2.5 text-sm font-medium text-white shadow-sm transition-colors hover:bg-indigo-700"
	>
		Next
	</button>
</div>
