<div
    class="rounded-xl border border-slate-200 bg-white p-5 shadow-smc min-h-50"
>
    <h3 class="m-0 text-xl font-semibold tracking-tight text-slate-900">
        {{ filter().name }}
    </h3>

    <p class="mt-2 mb-4 text-sm text-slate-500">
        {{ filter().description ? filter().description : "No description" }}
    </p>

    <div class="flex flex-wrap gap-2">
        @for (item of filter().values.slice(0, MAX_FILTER_VALUES_TO_SHOW); track item.id) {
            <span
                class="inline-flex items-center rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm font-medium text-slate-700"
            >
                {{ item.name }}
            </span>
        }

        @if (isMoreValues()) {
            <span
                class="inline-flex items-center rounded-md border border-slate-200 bg-slate-50 px-3 py-1 text-sm font-medium text-slate-500"
            >
                ...
            </span>
        }
    </div>
</div>
