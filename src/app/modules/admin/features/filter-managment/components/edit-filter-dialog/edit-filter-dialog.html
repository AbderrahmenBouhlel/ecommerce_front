<div
    class="relative min-h-[80vh] rounded-xl px-5 bg-slate-100 text-slate-800 shadow-lg max-h-[90vh] animate-[fadeIn_.18s_ease]"
>
	<button
		[ngClass]="'absolute right-2 top-2 h-8 w-8 rounded text-2xl leading-none text-slate-500 transition hover:bg-slate-200 hover:text-slate-700'"
		type="button"
		aria-label="Close dialog"
		(click)="close()"
	>
		x
	</button>

	<div [ngClass]="'flex items-start justify-between gap-8 border-b border-slate-200 px-6 py-7'">
        <div>
            <h2 id="edit-filter-title" [ngClass]="'m-0 text-2xl leading-tight font-medium text-slate-900'">Edit Filter</h2>
		    <p [ngClass]="'mt-2 text-md text-slate-500'">Manage filter details and values for your taxonomy</p>
        </div>


        <!-- active status toggle -->
        <div class="flex gap-2  shadow-[0_2px_4px_rgba(0,0,0,0.1)] rounded-2xl px-3 py-3 ">
            <div>
                <p 
                    class=" text-base"
                    [ngClass]="inputFilter().isActive ? 'text-green-600' : 'text-slate-500'"
                >
                    {{ inputFilter().isActive ? 'Active' : 'Inactive' }}
                </p>
                <p class="text-gray-400 text-sm ">Filter status</p>
            </div>

            <div
                class="toggle"
                [class.active-bg]="inputFilter().isActive"
                (click)="toggleActive()"
            >
            <div class="knob" [class.active]="inputFilter().isActive"></div>
            </div>
            
        </div>

	</div>


    <!-- change filter name and description form -->
    <form [formGroup]="form" [ngClass]="'space-y-3 px-6 py-5'" (ngSubmit)="save()" >


		<label [ngClass]="'block text-base font-semibold tracking-wide text-slate-600'" for="filterName">Filter name:</label>
        <input
            id="filterName"
            formControlName="name"
            [ngClass]="'w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm outline-none transition focus:border-blue-300 focus:shadow-[0_0_0_3px_rgba(96,165,250,0.25)]'"
            type="text"
            placeholder="TYPE"
		/>
	
		<label [ngClass]="'block pt-1 text-base font-semibold tracking-wide text-slate-600'" for="filterDescription">Description: </label>
		<textarea
			id="filterDescription"
            formControlName="description"
			[ngClass]="'min-h-27.5 w-full resize-y rounded-xl border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 shadow-sm outline-none transition focus:border-blue-300 focus:shadow-[0_0_0_3px_rgba(96,165,250,0.25)] placeholder:text-slate-400'"
			rows="3"
			placeholder="Brief description of this filter\'s purpose"
		></textarea>

    
        <div class="flex justify-start">
            <button
                class="rounded-xl bg-blue-400 px-4 py-1 text-lg text-white transition hover:bg-blue-500 self-start "
                [ngClass]="isLoading() || form.invalid ? 'cursor-not-allowed opacity-50' : 'hover:bg-blue-500 cursor-pointer'"
                type="submit"
                [disabled]="form.invalid || isLoading()"
            >
                Save
            </button>
            <div
                class="mt-3 ml-5 min-h-5 text-sm transition-all duration-200"
                >
                <p
                    [ngClass]="form.invalid
                    ? 'text-amber-600 opacity-100'
                    : 'text-transparent opacity-0'"
                    class="font-medium"
                >
                    Please make changes to save.
                </p>
            </div>  
        </div>
        

	</form>

        
    <!-- filter values section -->
    <div class="pt-4 mb-8 relative">
        <p class="mb-3 text-base font-semibold tracking-wide text-slate-600">Filter Values</p>

        <button
                class="rounded-xl border cursor-pointer absolute top-2 right-0  px-4 py-2 text-md  transition duration-150 "
                (click)="toggleAddValueFormVisibility()"
                [ngClass]="{
                    'bg-blue-400 border-blue-400 text-white hover:bg-blue-500': addValueFormVisible(),
                    'bg-white border-slate-300 text-slate-700 hover:bg-slate-100': !addValueFormVisible()

                }"
                type="button"
            >
                {{ addValueFormVisible() ? 'Cancel' : '+ Add Value' }}
        </button>

        <div class="flex flex-col space-y-3 overflow-auto max-h-72 pt-2 px-2">
            @if (addValueFormVisible()) {
                <div class="mt-5 mb-5 rounded-2xl border border-slate-300 bg-slate-100 p-2 shadow-sm flex items-center gap-2">
                    <input
                        type="text"
                        placeholder="Enter new value name..."
                        [(ngModel)]="newFilterValueName"
                        class="flex-1 rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm text-slate-900 outline-none transition focus:border-blue-300 focus:shadow-[0_0_0_3px_rgba(96,165,250,0.25)]"
                    >

                    <button
                        class="rounded-xl bg-blue-400 px-4 py-2 text-sm font-medium text-white transition hover:bg-blue-500"
                        type="button"
                        (click)="createFilterValue()"
                    >
                        Add
                    </button>

                </div>
            }
            @for (value of inputFilter().values; track value.id) {
                <app-filter-value-item-component
                    [filterValue]="value"
                    (toggleEvent)="onFilterValueToggleEvent($event)"
                    (deleteEvent)="onFilterValueDeleteEvent($event)"
                ></app-filter-value-item-component>
            }
        </div>
    </div>

</div>
