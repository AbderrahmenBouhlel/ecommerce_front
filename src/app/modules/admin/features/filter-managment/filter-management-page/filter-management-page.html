<!-- PAGE HEADER -->
<section class="mx-auto w-full max-w-7xl px-4 pt-6 md:px-6">

    <!-- Title + description -->
    <div class="mb-24 mt-8">
        <h1 class="text-3xl font-semibold tracking-tight text-slate-900">
            Filters Management
        </h1>

        <p class="mt-1 text-md text-slate-500 max-w-2xl">
            Manage product filters and attributes used to refine search and categorization across your store.
        </p>
    </div>

    <!-- Actions bar -->
    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-6">

        <!-- Search -->
        <div class="relative w-full sm:max-w-sm">
            <input
                type="text"
                placeholder="Search filters..."
                class="w-full rounded-lg border border-slate-200 bg-white px-3 py-2 pl-9 text-sm text-slate-700 shadow-sm outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-200"
            />

            <!-- search icon -->
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400">
                <mat-icon class="text-[18px]">search</mat-icon>
            </span>
        </div>

        <!-- Create button -->
        <button
            class="inline-flex items-center justify-center gap-2 rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white shadow-sm transition hover:bg-slate-800 active:scale-[0.98]"
            (click)="openAddFilterDialog()"

        >
            <mat-icon class="text-[18px]">add</mat-icon>
            Add Filter
        </button>

    </div>

</section>


<!-- FILTER GRID -->
<section class="mx-auto w-full max-w-7xl px-4 pb-6 md:px-6">
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3">

        @for (item of allFilters$(); track item.id) {
            <div 
                class="transition duration-150 ease-in cursor-pointer"
                [ngClass]="{
                        'opacity-50 grayscale': !item.isActive,
                        'transform hover:-translate-y-0.5': item.isActive
                    }"
                (click)="openEditFilterDialog(item)"
            >
                <app-filter-card-component [filter]="item"></app-filter-card-component>
            </div>
        }
    </div>
</section>
